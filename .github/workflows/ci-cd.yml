name: DevOps CI/CD Pipeline (LocalStack Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    # Run LocalStack directly as a native Docker service container
    services:
      localstack:
        image: localstack/localstack:3.8.0
        ports:
          - 4566:4566
          - 4510-4559:4510-4559

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install awscli-local
        run: pip install awscli-local

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Wait for LocalStack Health Check
        run: |
          until curl -s http://localhost:4566/_localstack/health | grep -q '"dynamodb": "running"\|"available"'; do
            echo "Waiting for LocalStack container to start..."
            sleep 2
          done
          echo "LocalStack is ready!"

      - name: Initialize and Validate Terraform
        run: |
          cd terraform
          terraform init
          terraform validate

      - name: Deploy Infrastructure to LocalStack
        run: |
          cd terraform
          terraform apply -auto-approve

      - name: Run Integration Tests Against Local AWS
        run: |
          awslocal dynamodb list-tables
          awslocal lambda invoke --function-name UserServiceFunction output.json
          grep -q "200" output.json && echo "Integration Test Passed!" || exit 1